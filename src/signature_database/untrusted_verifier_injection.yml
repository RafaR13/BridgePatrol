id: UNTRUSTED_VERIFIER_INJECTION
enabled: true
name: Untrusted verifier injection

description: >
  Detects that a verifier/implementation pointer changed to an untrusted address,
  or its bytecode fingerprint diverges from an expected reference.

requires:
  events: [UPGRADED, VERIFIER_UPDATED, OWNERSHIP_TRANSFERRED]  # TODO: depends on bridge
  keys: [verifier_address]
  rpc: [eth_call, eth_getCode, eth_getLogs]

params:
  pointer_source:
    # how to read verifier pointer; fill later per bridge
    mode: "eth_call"
    contract_address: ""
    function_signature: "verifier()"   # example
  allowlist:
    verifier_addresses: []
  bytecode_fingerprint:
    enabled: true
    expected_code_hashes: {}

evidence:
  include_fields:
    - chain
    - verifier_address
    - code_hash
    - tx_hash
    - block_number
